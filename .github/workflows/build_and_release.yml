name: Build and Release Kiwi Manager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Tiêu đề bản phát hành (ví dụ: Bản cập nhật v1.0.0)'
        required: false
        default: 'Cập nhật tự động'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/signing/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/signing/release.jks"

      - name: Organize Release Artifacts
        id: organize
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$VERSION_TAG" = "refs/heads/main" ] || [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v1.0.0"
          fi
          mkdir -p release_apks
          cp app/build/outputs/apk/release/app-release.apk release_apks/KiwiManager-${VERSION_TAG}.apk
          echo "tag_name=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "Danh sách file phát hành:"
          ls -lh release_apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release_apks/*
          name: ${{ github.event.inputs.release_title || steps.organize.outputs.tag_name }}
          tag_name: ${{ steps.organize.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
